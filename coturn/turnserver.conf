# coturn — TURN/STUN server para Ametista Tarot (Fase 4 do WebRTC).
# A senha vem de `static-auth-secret` que é injetada do TURN_SHARED_SECRET
# no entrypoint do container (env-substituted antes do start). Veja
# docker-compose.yml e docs/turn-setup.md.

listening-port=3478
fingerprint
use-auth-secret
static-auth-secret=__REPLACED_AT_BOOT__
realm=ametista.braviaglobal.com.br

# Limite de sessões simultâneas — protege a VM Hostinger de abuso.
total-quota=100
stale-nonce=600

# Sem TLS por enquanto (TLS exige cert válido — Fase 6 se necessário).
no-tls
no-dtls
no-multicast-peers

# Faixa enxuta de relay (40 portas). Tem que casar com o firewall Hostinger.
min-port=49160
max-port=49200

log-file=stdout
verbose
