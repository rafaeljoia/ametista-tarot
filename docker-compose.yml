# version: '3.8' (obsolete)

services:
  postgres:
    image: postgres:15-alpine
    container_name: ametista_postgres
    environment:
      POSTGRES_USER: ametista
      POSTGRES_PASSWORD: ametista123
      POSTGRES_DB: ametista_tarot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ametista_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ametista"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ametista_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ametista_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ametista_backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ametista
      DB_PASSWORD: ametista123
      DB_NAME: ametista_tarot
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      NODE_ENV: development
      PORT: 3001
      FRONTEND_URL: http://localhost:3000
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
    networks:
      - ametista_network
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ametista_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - ametista_network
    command: npm run dev

volumes:
  postgres_data:
  redis_data:

networks:
  ametista_network:
    driver: bridge
