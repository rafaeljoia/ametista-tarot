# version: '3.8' (obsolete)

services:
  postgres:
    image: postgres:15-alpine
    container_name: ametista_postgres
    environment:
      POSTGRES_USER: ametista
      POSTGRES_PASSWORD: ametista123
      POSTGRES_DB: ametista_tarot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ametista"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ametista_redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ametista_backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ametista
      DB_PASSWORD: ametista123
      DB_NAME: ametista_tarot
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      NODE_ENV: production
      PORT: 3001
      FRONTEND_URL: https://ametista.braviaglobal.com.br
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ametista_frontend
    environment:
      NEXT_PUBLIC_API_URL: https://ametista.braviaglobal.com.br/api
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
