version: '3.8'

networks:
  dokploy-network:
    external: true

services:
  postgres:
    image: postgres:15-alpine
    container_name: ametista_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ametista}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no env do Dokploy}
      POSTGRES_DB: ${POSTGRES_DB:-ametista_tarot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ametista"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ametista_redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ametista_backend
    restart: always
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USERNAME: ${DB_USERNAME:-ametista}
      DB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no env do Dokploy}
      DB_NAME: ${DB_NAME:-ametista_tarot}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no env do Dokploy}
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3001}
      FRONTEND_URL: ${FRONTEND_URL}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:-}
      TURN_HOST: ${TURN_HOST:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.ametista-api.rule=Host(`ametista.braviaglobal.com.br`) && PathPrefix(`/api`)"
      - "traefik.http.routers.ametista-api.entrypoints=websecure"
      - "traefik.http.routers.ametista-api.tls=true"
      - "traefik.http.routers.ametista-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.ametista-api.priority=100"
      - "traefik.http.services.ametista-api.loadbalancer.server.port=3001"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://ametista.braviaglobal.com.br/api
    container_name: ametista_frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    depends_on:
      - backend
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.ametista.rule=Host(`ametista.braviaglobal.com.br`)"
      - "traefik.http.routers.ametista.entrypoints=websecure"
      - "traefik.http.routers.ametista.tls=true"
      - "traefik.http.routers.ametista.tls.certresolver=letsencrypt"
      - "traefik.http.routers.ametista.priority=10"
      - "traefik.http.services.ametista.loadbalancer.server.port=3000"

  # coturn — TURN/STUN para WebRTC (voz/vídeo). network_mode:host é
  # OBRIGATÓRIO para TURN funcionar atrás do NAT da Hostinger; bridge não
  # serve. Por isso este serviço fica fora da dokploy-network.
  # Se TURN_SHARED_SECRET não estiver setado, o backend cai em STUN-only e o
  # coturn pode ficar parado (basta `docker compose up -d coturn` quando setar).
  coturn:
    image: coturn/coturn:4.6
    container_name: ametista_coturn
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf.template:ro
    environment:
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:-}
    # Substitui o placeholder pelo segredo real e sobe o coturn.
    entrypoint: >
      sh -c 'sed "s|__REPLACED_AT_BOOT__|$${TURN_SHARED_SECRET}|g"
             /etc/coturn/turnserver.conf.template > /etc/coturn/turnserver.conf
             && exec turnserver -c /etc/coturn/turnserver.conf'

volumes:
  postgres_data:
  redis_data:
